# Olares injects the envs declared in OlaresManifest.yaml (user value or default) into olaresEnv.
olaresEnv: {}

image:
  repository: ghcr.io/crescent617/yomi
  tag: "0.7.75"
  pullPolicy: IfNotPresent

# Replica counts per workload, mirrored by workloadReplicas in OlaresManifest.yaml.
workloads:
  yomi:
    replicaCount: 1

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 4Gi
